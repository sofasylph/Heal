services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claimtrace
      POSTGRES_PASSWORD: claimtrace
      POSTGRES_DB: claimtrace
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimtrace"]
      interval: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://claimtrace:claimtrace@db:5432/claimtrace
      CORS_ORIGINS: http://localhost:3000
      CLAIMTRACE_LLM_PROVIDER: ${CLAIMTRACE_LLM_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Ollama running on the host machine
      CLAIMTRACE_OLLAMA_URL: ${CLAIMTRACE_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
